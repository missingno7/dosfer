apply plugin: 'com.android.application'

android {
    namespace 'org.dosfer.receiver'
    compileSdk 36
    defaultConfig {
        applicationId 'org.dosfer.receiver'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.4.0-rgb3'
    }
    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'io.github.zxing-cpp:android:3.1.0'
    testImplementation 'junit:junit:4.13.2'
}
